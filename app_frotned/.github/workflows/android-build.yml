name: Build Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches:
      - '*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Clear Metro bundler cache
        run: rm -rf $TMPDIR/metro-* $TMPDIR/haste-* || true

      - name: Remove hardcoded Java home from gradle.properties
        run: sed -i '/org.gradle.java.home/d' android/gradle.properties

      - name: Reduce Gradle JVM memory for CI
        run: sed -i 's/-Xmx20048m/-Xmx4096m/' android/gradle.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK and AAB Bundle
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon --parallel

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahaya-latest-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release AAB Bundle artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: sahaya-latest-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest GitHub Release
        run: |
          gh release create latest \
            android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/bundle/release/app-release.aab \
            --title "Latest Build (APK + AAB)" \
            --notes "Automated build from commit ${{ github.sha }}. Includes APK for direct install and AAB for Google Play Store. Updated on: $(date -u '+%Y-%m-%d %H:%M UTC')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
